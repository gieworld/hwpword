<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rhwp Print Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e5e7eb;
      color: #334155;
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .print-loading {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    .print-loading-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #bfdbfe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: print-loading-spin 800ms linear infinite;
    }
    @keyframes print-loading-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .print-loading-spinner { animation: none; border-color: #2563eb; }
    }
  </style>
</head>
<body>
  <main class="print-loading" role="status" aria-live="polite">
    <span class="print-loading-spinner" aria-hidden="true"></span>
    <span id="print-loading-message">Preparing print preview…</span>
  </main>
</body>
</html>
